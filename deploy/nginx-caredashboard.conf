# CARE Rwanda Activity Dashboard: proxies dashboard.care.org.rw on port 80 to the Next.js app on :3001.
# Enabled as sites-enabled/zz-caredashboard (loads after "default") so the CARE site stays the default server for other host names.
server {
    listen 80;
    server_name dashboard.care.org.rw;

    # Activities can carry up to six 5 MB photos.
    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
